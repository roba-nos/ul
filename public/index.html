<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Push Pro | Futuristic Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-atom fa-spin" style="color: var(--primary);"></i>
            <span>SMART PUSH</span>
        </div>
        
        <a href="index.html" class="nav-item active">
            <i class="fas fa-th-large"></i> نظرة عامة
        </a>
        <a href="send.html" class="nav-item">
            <i class="fas fa-paper-plane"></i> إرسال حملة
        </a>
        <a href="templates.html" class="nav-item">
            <i class="fas fa-magic"></i> مكتبة القوالب
        </a>
        <a href="sites.html" class="nav-item">
            <i class="fas fa-satellite-dish"></i> المواقع النشطة
        </a>
        <a href="integration.html" class="nav-item">
            <i class="fas fa-terminal"></i> دمج النظام
        </a>
        
        <div class="theme-btn" onclick="toggleTheme()">
            <i class="fas fa-adjust" id="theme-icon"></i>
        </div>

        <div style="margin-top: auto; padding: 10px;">
            <p style="font-size: 0.7rem; color: var(--text-dim); text-align: center;">إصدار برو v2.0</p>
        </div>
    </div>

    <div class="main-content">
        <h2 style="background: linear-gradient(to left, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">نظرة عامة 🚀</h2>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-subs">0</div>
                <div class="stat-label" style="font-weight: 700; color: var(--text-dim);">إجمالي المشتركين</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-sites">0</div>
                <div class="stat-label" style="font-weight: 700; color: var(--text-dim);">المواقع المتصلة</div>
            </div>
        </div>

        <div class="card" style="position: relative; overflow: hidden;">
            <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: var(--primary); filter: blur(50px); opacity: 0.3;"></div>
            <h3>النشاط اللحظي للنظام 📊</h3>
            <p style="color: var(--text-dim); margin-top: 20px; line-height: 1.8;">جميع الأنظمة تعمل بكفاءة عالية. يتم مراقبة حركة المشتركين في الوقت الفعلي من جميع المواقع المتصلة.</p>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script>
        async function init() {
            const data = await fetchStats();
            document.getElementById('total-subs').innerText = data.total || 0;
            document.getElementById('total-sites').innerText = Object.keys(data.sites || {}).length;
        }
        init();
    </script>
</body>
</html>
