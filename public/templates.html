<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة القوالب | Smart Push Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-atom fa-spin"></i> <span>SMART PUSH</span></div>
        <a href="index.html" class="nav-item"><i class="fas fa-th-large"></i> نظرة عامة</a>
        <a href="send.html" class="nav-item"><i class="fas fa-paper-plane"></i> إرسال حملة</a>
        <a href="templates.html" class="nav-item active"><i class="fas fa-magic"></i> مكتبة القوالب</a>
        <a href="sites.html" class="nav-item"><i class="fas fa-satellite-dish"></i> المواقع النشطة</a>
        <div class="theme-btn" onclick="toggleTheme()">
            <i class="fas fa-adjust" id="theme-icon"></i>
        </div>
    </div>

    <div class="main-content">
        <h2 style="background: linear-gradient(to left, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">مكتبة القوالب 📚</h2>

        <div class="card" style="padding: 15px 25px; display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
            <i class="fas fa-search" style="color: var(--primary); font-size: 1.1rem;"></i>
            <input type="text" id="search-input" placeholder="ابحث عن قالب..." oninput="renderTemplates()" style="background: transparent !important; border: none !important; font-size: 1rem; width: 100%;">
            <button class="btn btn-primary" onclick="openAddModal()" style="white-space: nowrap;">
                <i class="fas fa-plus"></i> إضافة قالب
            </button>
        </div>

        <div id="templates-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px;">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Add Template Modal -->
    <div id="add-modal" class="modal-overlay" onclick="if(event.target == this) closeAddModal()">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3>إضافة قالب جديد ➕</h3>
                <i class="fas fa-times close-modal" onclick="closeAddModal()"></i>
            </div>
            <div style="display: grid; gap: 15px;">
                <input type="text" id="new-title" placeholder="عنوان القالب..." style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: white;">
                <textarea id="new-body" placeholder="نص الإشعار..." rows="3" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: white;"></textarea>
                <input type="text" id="new-icon" placeholder="رابط الأيقونة (Image URL)..." style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: white;">
                <input type="text" id="new-fa" placeholder="أيقونة FontAwesome (مثال: fas fa-gift)" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: white;">
                <input type="text" id="new-url" placeholder="رابط التحويل (URL)..." style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: white;">
                
                <button class="btn btn-primary" onclick="addNewTemplate()" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ القالب الجديد</button>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script>
        function renderTemplates() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('templates-grid');
            const all = getAllTemplates();
            const filtered = all.filter(t => t.title.toLowerCase().includes(query) || t.body.toLowerCase().includes(query));

            grid.innerHTML = filtered.map(t => `
                <div class="card" style="display: flex; flex-direction: column; gap: 20px; transition: 0.3s; cursor: pointer;" onclick="useTemplate('${t.id}')">
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <div style="width: 60px; height: 60px; background: rgba(99, 102, 241, 0.1); border-radius: 20px; display: flex; justify-content: center; align-items: center;">
                            <i class="${t.faIcon || 'fas fa-bell'}" style="font-size: 1.5rem; color: var(--primary);"></i>
                        </div>
                        <div style="flex: 1;">
                            <div style="font-weight: 800; font-size: 1.1rem;">${t.title}</div>
                            <div style="font-size: 0.85rem; color: var(--text-dim); margin-top: 5px;">${t.body.substring(0, 50)}...</div>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: flex-end;">
                        <span style="color: var(--primary); font-weight: 700;">استخدام القالب <i class="fas fa-arrow-left"></i></span>
                    </div>
                </div>
            `).join('');
        }

        function useTemplate(id) {
            const t = getAllTemplates().find(x => x.id === id);
            if (t) {
                const params = new URLSearchParams({ title: t.title, body: t.body, icon: t.icon, url: t.url || '' });
                window.location.href = `send.html?${params.toString()}`;
            }
        }

        // --- Add Template Modal Logic ---
        function openAddModal() {
            document.getElementById('add-modal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('add-modal').style.display = 'none';
        }

        function addNewTemplate() {
            const template = {
                title: document.getElementById('new-title').value,
                body: document.getElementById('new-body').value,
                icon: document.getElementById('new-icon').value,
                faIcon: document.getElementById('new-fa').value || 'fas fa-bell',
                url: document.getElementById('new-url').value
            };

            if (!template.title || !template.body) return showToast('يرجى ملء الحقول الأساسية', 'error');

            saveCustomTemplate(template);
            closeAddModal();
            renderTemplates(); // إعادة تحميل الشبكة
            
            // تنظيف الحقول
            ['new-title', 'new-body', 'new-icon', 'new-fa', 'new-url'].forEach(id => document.getElementById(id).value = '');
        }

        window.onload = renderTemplates;
    </script>
</body>
</html>
